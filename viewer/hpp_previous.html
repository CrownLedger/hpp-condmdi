<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HPP v0.2 × CondMDI</title>
<style>
  :root { --bg: #14161b; --panel: #0d0f13; --line: #2b2f38; --text: #e6e6e6; --dim: #8a90a0; --key: #ffd54f; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #ui { padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  h1 { font-size: 15px; margin: 0; font-weight: 650; }
  h1 small { color: var(--dim); font-weight: 400; }
  a { color: #8ab4ff; }
  button, select { background: #252933; color: var(--text); border: 1px solid #3a3f4b; border-radius: 6px; padding: 3px 9px; font: inherit; cursor: pointer; }
  button.on { background: #3b4252; border-color: #6b7385; }
  #caption { color: var(--key); }
  #stats { color: var(--dim); }
  #frame { font-variant-numeric: tabular-nums; min-width: 105px; }
  #kf { color: var(--key); min-width: 220px; font-variant-numeric: tabular-nums; }
  #tlwrap { position: relative; flex: 1; min-width: 260px; }
  #timeline { width: 100%; height: 104px; display: block; cursor: pointer; }
  .legend span { white-space: nowrap; margin-right: 10px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #c3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #panels { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); pointer-events: none; }
  #panels > div { border: 1px solid var(--line); position: relative; }
  #panels .lbl { position: absolute; top: 6px; left: 8px; font-weight: 650; background: #000a; padding: 2px 8px; border-radius: 6px; }
  #panels .sub:empty { display: none; }
  #panels .sub { position: absolute; bottom: 6px; left: 8px; color: var(--dim); font-size: 12px; background: #0008; padding: 1px 6px; border-radius: 5px; font-variant-numeric: tabular-nums; }
  @media (max-width: 760px) { #panels { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); } #timeline { height: 90px; } }
  #metrics { position: absolute; right: 10px; bottom: 10px; max-width: calc(100% - 20px); max-height: 70%; overflow: auto; background: #0d0f13f2;
             border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  #metrics table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  #metrics th, #metrics td { padding: 3px 9px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  #metrics th:first-child, #metrics td:first-child { text-align: left; }
  #metrics th { color: var(--dim); font-weight: 500; }
  #metrics .note { color: var(--dim); max-width: 760px; margin-top: 8px; white-space: normal; }
</style>
<script type="importmap">{ "imports": { "three": "./three.module.js" } }</script>
</head>
<body>
<div id="ui">
  <div class="row">
    <h1>HPP v0.2 × CondMDI <small>Human-Perceptual Projection on HumanML3D</small></h1>
    <label>Rough motion <select id="motion"></select></label>
    <label>Realizer <select id="variant"></select></label>
    <a href="index.html">← earlier CondMDI viewer</a>
  </div>
  <div class="row"><span id="caption"></span><span id="stats"></span></div>
  <div class="row">
    <button id="play">Pause</button><button id="prev">◀</button><button id="next">▶</button>
    <label>Speed <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select></label>
    <span id="frame"></span><span id="kf"></span>
  </div>
  <div class="row"><div id="tlwrap"><canvas id="timeline"></canvas></div></div>
  <div class="row">
    <label><input type="checkbox" id="tKeys" checked> Key trajectories</label>
    <label><input type="checkbox" id="tTargets" checked> Constraint targets</label>
    <label><input type="checkbox" id="tGhost"> Original ghost on outputs</label>
    <label><input type="checkbox" id="tFollow" checked> Camera follows root</label>
    <label><input type="checkbox" id="tPauseKey"> Pause on observed frames</label>
    <button id="bMetrics">Metrics</button>
    <span class="legend" id="reasonLegend"></span>
  </div>
</div>
<div id="stage">
  <canvas id="c3d"></canvas>
  <div id="panels"></div>
  <div id="metrics" hidden></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './OrbitControls.js';

const CHAINS = [[0,2,5,8,11],[0,1,4,7,10],[0,3,6,9,12,15],[9,14,17,19,21],[9,13,16,18,20]];
const CHAIN_SHADE = [0.85, 0.85, 1.0, 0.7, 0.7];
const KEY = 0xffd54f;
const REASONS = { start_end: ['#ffffff', 'start/end'], contact: ['#ff5252', 'contact/release'], extremum: ['#ffd54f', 'extremum'],
                  direction: ['#4fc3f7', 'direction change'], pause: ['#81c784', 'pause'], error: ['#9e9e9e', 'error-driven'],
                  key_pose: ['#b388ff', 'key pose (slerp)'] };
const METHOD = { hermite: 'HPP v0.2 · cubic Hermite + IK', slerp_pose: 'Robotic · per-joint slerp between key poses',
                 slerp_joint: 'Robotic · per-joint slerp, per-joint keys' };
const LANES = [['root', 'Root'], ['left_wrist', 'L wrist'], ['right_wrist', 'R wrist'], ['left_ankle', 'L ankle'],
               ['right_ankle', 'R ankle'], ['left_foot', 'L foot'], ['right_foot', 'R foot'], ['torso', 'Torso']];
const COLORS = { original: 0xe8e8e8, rough: 0xb388ff, reps: [0x4fc3f7, 0xff8a65, 0x81c784] };
// Panels: [label, layer, sub-key]
const PANELS = [
  { label: 'Original (HumanML3D)', color: COLORS.original, key: 'original' },
  { label: 'HPP rough motion', color: COLORS.rough, key: 'rough' },
  { label: 'Overlay: original · rough · rep 0', color: 0xffffff, key: 'overlay' },
  { label: 'CondMDI realized · rep 0', color: COLORS.reps[0], key: 'rep0' },
  { label: 'CondMDI realized · rep 1', color: COLORS.reps[1], key: 'rep1' },
  { label: 'CondMDI realized · rep 2', color: COLORS.reps[2], key: 'rep2' },
];
PANELS.forEach((p, i) => p.layer = i + 1);
const L = Object.fromEntries(PANELS.map(p => [p.key, p.layer]));

const data = await (await fetch('hpp_previous_data.json')).json();
const $ = id => document.getElementById(id);

// ---------------- three.js setup ----------------
const canvas = $('c3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled = true;
renderer.setScissorTest(true);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161b);
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 100);
camera.position.set(0.6, 1.55, 3.1);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.85, 0);
controls.enableDamping = true;

const hemi = new THREE.HemisphereLight(0xffffff, 0x333344, 1.2);
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(3, 8, 4); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 });
sun.shadow.mapSize.set(2048, 2048);
for (const l of [hemi, sun]) { l.layers.enableAll(); scene.add(l); }
scene.add(sun.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x1f2229 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(60, 120, 0x3a404c, 0x2a2e37); grid.position.y = 0.001; scene.add(grid);

const sphereGeo = new THREE.SphereGeometry(1, 16, 12);
const boneGeo = new THREE.CylinderGeometry(1, 1, 1, 10); boneGeo.translate(0, 0.5, 0);
const UP = new THREE.Vector3(0, 1, 0), va = new THREE.Vector3(), vb = new THREE.Vector3(), dir = new THREE.Vector3();

function setLayers(obj, layers) {
  obj.traverse(o => { o.layers.disableAll(); layers.forEach(l => o.layers.enable(l)); });
}

class Skeleton {
  constructor(frames, color, layers, { opacity = 1, radius = 0.032 } = {}) {
    this.frames = frames; this.color = new THREE.Color(color); this.radius = radius;
    this.group = new THREE.Group();
    const transparent = opacity < 1;
    const mk = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.45, transparent, opacity, depthWrite: !transparent });
    this.joints = frames[0].map(() => { const m = new THREE.Mesh(sphereGeo, mk(this.color)); m.castShadow = !transparent; m.scale.setScalar(radius); this.group.add(m); return m; });
    this.bones = [];
    CHAINS.forEach((ch, ci) => { const mat = mk(this.color.clone().multiplyScalar(CHAIN_SHADE[ci]));
      for (let i = 0; i < ch.length - 1; i++) { const b = new THREE.Mesh(boneGeo, mat); b.castShadow = !transparent; this.group.add(b); this.bones.push([b, ch[i], ch[i + 1]]); } });
    setLayers(this.group, layers);
    world.add(this.group);
  }
  pose(f) {
    const fr = this.frames[Math.min(f, this.frames.length - 1)];
    fr.forEach((p, j) => this.joints[j].position.set(p[0], p[1], p[2]));
    const r = this.radius * 0.6;
    for (const [m, a, b] of this.bones) {
      va.fromArray(fr[a]); vb.fromArray(fr[b]); dir.subVectors(vb, va);
      m.position.copy(va); m.scale.set(r, dir.length(), r); m.quaternion.setFromUnitVectors(UP, dir.normalize());
    }
  }
  highlight(js) {
    const s = new Set(js);
    this.joints.forEach((m, j) => { const on = s.has(j);
      m.material.color.set(on ? KEY : this.color); m.material.emissive.set(on ? 0x553300 : 0x000000);
      m.scale.setScalar(this.radius * (on ? 1.7 : 1)); });
  }
}

const world = new THREE.Group(); scene.add(world);
let S = null, nFrames = 1, t = 0, playing = true, lastF = -1;

// Constraint target markers (yellow wire spheres at the original's constrained joints), shared by rep panels.
const targetMat = new THREE.MeshBasicMaterial({ color: KEY, wireframe: true, transparent: true, opacity: 0.9 });

function buildKeyTrajectories(m) {
  // Original path of every keyed joint + key dots colored by why HPP selected them.
  const g = new THREE.Group();
  for (const [name, tr] of Object.entries(m.trajectories)) {
    const pts = m.original.map(f => new THREE.Vector3(...f[tr.joint]));
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x6b7385, transparent: true, opacity: 0.7 })));
    const pos = [], col = [];
    for (const f of tr.frames) {
      pos.push(...m.original[f][tr.joint]);
      const c = new THREE.Color(REASONS[tr.reasons[f]]?.[0] ?? '#ffffff'); col.push(c.r, c.g, c.b);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.035, vertexColors: true })));
  }
  setLayers(g, [L.original, L.rough]);
  world.add(g);
  return g;
}

function load() {
  world.clear();
  const m = data.motions[+$('motion').value];
  const v = m.variants[+$('variant').value];
  nFrames = m.frames;
  S = { m, v,
    original: new Skeleton(m.original, COLORS.original, [L.original, L.overlay]),
    rough: new Skeleton(m.rough, COLORS.rough, [L.rough, L.overlay]),
    reps: v.realized.slice(0, 3).map((fr, i) => new Skeleton(fr, COLORS.reps[i], i === 0 ? [L.rep0, L.overlay] : [L[`rep${i}`]])),
    ghost: new Skeleton(m.original, COLORS.original, [L.rep0, L.rep1, L.rep2], { opacity: 0.18, radius: 0.026 }),
    keys: buildKeyTrajectories(m),
    targets: Array.from({ length: 22 }, () => { const s = new THREE.Mesh(sphereGeo, targetMat); s.scale.setScalar(0.055); setLayers(s, [L.rep0, L.rep1, L.rep2]); world.add(s); return s; }),
  };
  document.querySelector('#panels > div:nth-child(2) .lbl').textContent = m.method.startsWith('slerp') ? 'Rough motion · robotic slerp' : 'HPP rough motion · Hermite';
  $('caption').textContent = `HumanML3D ${m.id}: "${m.caption}" · ${m.frames} frames @ ${m.fps} fps (${(m.frames / m.fps).toFixed(1)} s) · no text given to CondMDI`;
  const hr = m.hpp_report;
  $('stats').textContent = (m.method.startsWith('slerp') ? `${m.torso.frames.length} key poses (mean ${(m.frames / m.fps / (m.torso.frames.length - 1)).toFixed(2)} s apart) · ` : '') + `HPP keeps ${hr.observed_joint_frames} of ${hr.total_joint_frames} joint-frames (${(100 * hr.observed_joint_frames / hr.total_joint_frames).toFixed(1)}%) on ${hr.observed_frames_any_joint} frames`;
  t = 0; lastF = -1;
  applyToggles(); renderMetrics(); drawTimeline();
}

// ---------------- UI ----------------
data.motions.forEach((m, i) => $('motion').add(new Option(`${m.id} — ${METHOD[m.method] ?? m.method}`, i)));
function fillVariants() {
  $('variant').innerHTML = '';
  data.motions[+$('motion').value].variants.forEach((v, i) => $('variant').add(new Option(v.label, i)));
}
fillVariants();
$('motion').onchange = () => { fillVariants(); load(); };
$('variant').onchange = load;
$('reasonLegend').innerHTML = 'Key reason: ' + Object.values(REASONS).map(([c, n]) => `<span><i class="dot" style="background:${c}"></i>${n}</span>`).join('');
$('panels').innerHTML = PANELS.map(p => `<div><span class="lbl" style="color:#${new THREE.Color(p.color).getHexString()}">${p.label}</span><span class="sub" id="sub-${p.key}"></span></div>`).join('');
const setPlaying = p => { playing = p; $('play').textContent = p ? 'Pause' : 'Play'; };
$('play').onclick = () => setPlaying(!playing);
const step = d => { setPlaying(false); t = (Math.floor(t) + d + nFrames) % nFrames; };
$('prev').onclick = () => step(-1); $('next').onclick = () => step(1);
addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); $('play').onclick(); }
  if (e.code === 'ArrowLeft') step(-1);
  if (e.code === 'ArrowRight') step(1);
});
function applyToggles() {
  if (!S) return;
  S.keys.visible = $('tKeys').checked;
  S.ghost.group.visible = $('tGhost').checked;
  lastF = -1;
}
for (const id of ['tKeys', 'tTargets', 'tGhost']) $(id).onchange = applyToggles;
$('bMetrics').onclick = () => { const on = $('metrics').hidden = !$('metrics').hidden; $('bMetrics').classList.toggle('on', !on); };

// ---------------- timeline (one lane per keyed trajectory) ----------------
const tl = $('timeline');
function drawTimeline() {
  const w = tl.clientWidth, h = tl.clientHeight, dpr = devicePixelRatio;
  tl.width = w * dpr; tl.height = h * dpr;
  const ctx = tl.getContext('2d'); ctx.scale(dpr, dpr);
  const labelW = 58, lh = (h - 4) / LANES.length, X = f => labelW + (f + 0.5) / nFrames * (w - labelW - 4);
  ctx.font = '11px system-ui, sans-serif'; ctx.textBaseline = 'middle';
  LANES.forEach(([key, name], i) => {
    const y = 2 + i * lh;
    ctx.fillStyle = i % 2 ? '#1a1d24' : '#1e222a'; ctx.fillRect(labelW, y, w - labelW - 4, lh);
    ctx.fillStyle = '#8a90a0'; ctx.fillText(name, 2, y + lh / 2);
    const tr = key === 'torso' ? S.m.torso : S.m.trajectories[key];
    for (const f of tr.frames) { ctx.fillStyle = REASONS[tr.reasons[f]]?.[0] ?? '#fff'; ctx.fillRect(X(f) - 1, y + 2, 2.2, lh - 4); }
  });
  const x = X(Math.floor(t));
  ctx.fillStyle = '#ffffffcc'; ctx.fillRect(x - 0.75, 0, 1.5, h);
}
let drag = false;
const seek = e => { const r = tl.getBoundingClientRect(), labelW = 58;
  t = Math.min(nFrames - 1, Math.max(0, Math.floor((e.clientX - r.left - labelW) / (r.width - labelW - 4) * nFrames))); };
tl.onpointerdown = e => { drag = true; setPlaying(false); seek(e); tl.setPointerCapture(e.pointerId); };
tl.onpointermove = e => drag && seek(e);
tl.onpointerup = () => drag = false;

// ---------------- metrics ----------------
function renderMetrics() {
  const { original, hpp_rough, realized } = S.v.metrics;
  const vel = S.v.velocity;
  const rows = [['Original', original, null], ['Rough motion', hpp_rough, vel?.rough_vs_original],
                ...realized.map((r, i) => [`CondMDI rep ${i}`, r, vel?.realized[i]])];
  const cm = x => (100 * x).toFixed(1);
  const cols = [
    ['MPJPE vs original (cm)', r => cm(r.mpjpe_m)],
    ['Constraint err mean / max (cm)', r => `${cm(r.constraint_err_mean_m)} / ${cm(r.constraint_err_max_m)}`],
    ['Root final disp. err (cm)', r => cm(r.root_final_disp_err_m)],
    ['Bone-length std (mm)', r => (1000 * r.bone_len_std_m).toFixed(1)],
    ['Foot skate (m/s)', r => r.foot_skate_mps.toFixed(2)],
    ['Min foot height (cm)', r => cm(r.min_foot_height_m)],
    ['Jerk (m/s³)', r => r.jerk_mps3.toFixed(0)],
    ['Contact events recall / precision', r => `${(100 * r.contact_timing.recall).toFixed(0)}% / ${(100 * r.contact_timing.precision).toFixed(0)}%`],
    ['Velocity err vs rough: constrained / all (m/s)', (r, v) => v ? `${v.vel_err_vs_rough_at_constraints.toFixed(2)} / ${v.vel_err_vs_rough_all.toFixed(2)}` : '—'],
    ['Speed corr. with rough', (r, v) => v ? v.speed_corr_with_rough_primary.toFixed(2) : '—'],
  ];
  $('metrics').innerHTML = `<b>${S.v.label}</b><div style="overflow-x:auto"><table><tr><th></th>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr>` +
    rows.map(([n, r, v]) => `<tr><td>${n}</td>${cols.map(c => `<td>${c[1](r, v)}</td>`).join('')}</tr>`).join('') + '</table></div>' +
    `<div class="note">CondMDI input: ${S.v.obs_source === 'rough' ? 'features computed from the rough motion only' : 'features of the REAL motion (comparison)'}. ` +
    `Constraint error is measured against the original at the joint-frames given to CondMDI: HPP's ${S.m.hpp_report.observed_joint_frames} observations ` +
    `plus the root on every observed frame (CondMDI's joint features are root-relative). Jerk is the mean third derivative of joint positions — ` +
    `CondMDI's own full-body keyframe benchmark gives ≈440 m/s³ on this clip, so values near that are the model's baseline jitter. ` +
    `Speed corr. is the correlation of primary-joint speeds with the rough motion over all frames.</div>`;
  PANELS.forEach(p => {
    const r = p.key === 'original' ? null : p.key === 'rough' ? hpp_rough : p.key.startsWith('rep') ? realized[+p.key[3]] : null;
    $(`sub-${p.key}`).textContent = r ? `MPJPE ${cm(r.mpjpe_m)} cm · constraint err ${cm(r.constraint_err_mean_m)} cm` : '';
  });
}

// ---------------- render loop ----------------
function resize() {
  const r = $('stage').getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  drawTimeline();
}
addEventListener('resize', resize);
fillVariants(); load(); resize();

const clock = new THREE.Clock(), prevTarget = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (playing) t = (t + dt * S.m.fps * +$('speed').value) % nFrames;
  const f = Math.floor(t);
  if (f !== lastF) {
    const obs = S.m.obs_per_frame[f], cons = S.v.constraints_per_frame[f];
    if (playing && $('tPauseKey').checked && obs.length && lastF !== -1 && f !== 0) setPlaying(false);
    S.original.pose(f); S.original.highlight(obs);
    S.rough.pose(f); S.rough.highlight(obs);
    S.reps.forEach(s => s.pose(f));
    S.ghost.pose(f);
    S.targets.forEach((m, j) => { const on = $('tTargets').checked && cons.includes(j); m.visible = on; if (on) m.position.fromArray(S.m.original[f][j]); });
    $('frame').textContent = `Frame ${f + 1} / ${nFrames}`;
    const names = obs.map(j => ['pelvis','L hip','R hip','spine1','L knee','R knee','spine2','L ankle','R ankle','spine3','L foot','R foot','neck','L collar','R collar','head','L shoulder','R shoulder','L elbow','R elbow','L wrist','R wrist'][j]);
    $('kf').textContent = obs.length ? `Observed: ${names.join(', ')}` : '';
    lastF = f;
    drawTimeline();
  }
  if ($('tFollow').checked) {   // keep the original's root centered, preserving the user's orbit offset
    const r = S.m.original[f][0], target = new THREE.Vector3(r[0], 0.85, r[2]);
    const d = target.clone().sub(controls.target);
    controls.target.add(d); camera.position.add(d);
  }
  controls.update();

  const stage = canvas.getBoundingClientRect();
  [...$('panels').children].forEach((div, i) => {
    const r = div.getBoundingClientRect();
    const x = r.left - stage.left, y = stage.bottom - r.bottom, w = r.width, h = r.height;
    renderer.setViewport(x, y, w, h); renderer.setScissor(x, y, w, h);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    camera.layers.set(0); camera.layers.enable(PANELS[i].layer);
    renderer.render(scene, camera);
  });
});
</script>
</body>
</html>
