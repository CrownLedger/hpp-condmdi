<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HPP × CondMDI Comparison</title>
<style>
  :root { --bg: #14161b; --panel: #0d0f13; --line: #2b2f38; --text: #e6e6e6; --dim: #8a90a0; --key: #ffd54f; --ok: #66bb6a; --bad: #ef5350; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  #ui { padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  h1 { font-size: 15px; margin: 0; font-weight: 650; }
  a { color: #8ab4ff; }
  button, select { background: #252933; color: var(--text); border: 1px solid #3a3f4b; border-radius: 6px; padding: 3px 9px; font: inherit; cursor: pointer; max-width: 100%; }
  button.on { background: #3b4252; border-color: #6b7385; }
  #caption { color: var(--key); }
  #stats { color: var(--dim); }
  #frame { font-variant-numeric: tabular-nums; min-width: 105px; }
  #kf { color: var(--key); font-variant-numeric: tabular-nums; }
  #tlwrap { flex: 1; min-width: 260px; }
  #timeline { width: 100%; height: 104px; display: block; cursor: pointer; }
  .legend span { white-space: nowrap; margin-right: 10px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #c3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #panels { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); pointer-events: none; }
  #panels > div { border: 1px solid var(--line); position: relative; }
  #panels .lbl { position: absolute; top: 6px; left: 8px; font-weight: 650; background: #000a; padding: 2px 8px; border-radius: 6px; }
  #panels .sub { position: absolute; bottom: 6px; left: 8px; color: var(--dim); font-size: 12px; background: #000a; padding: 1px 6px; border-radius: 5px; font-variant-numeric: tabular-nums; }
  #panels .sub:empty { display: none; }
  @media (max-width: 760px) { #panels { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); } #timeline { height: 90px; } }
  #metrics { position: absolute; right: 10px; bottom: 10px; left: 10px; max-height: 72%; overflow: auto; background: #0d0f13f4;
             border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  #metrics table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  #metrics th, #metrics td { padding: 3px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  #metrics th:first-child, #metrics td:first-child { text-align: left; }
  #metrics th { color: var(--dim); font-weight: 500; }
  .pass { color: var(--ok); } .fail { color: var(--bad); }
  .note { color: var(--dim); margin-top: 8px; max-width: 900px; }
  .badge { display: inline-block; padding: 0 5px; border-radius: 4px; margin-right: 2px; font-size: 11px; border: 1px solid currentColor; }
</style>
<script type="importmap">{ "imports": { "three": "./three.module.js" } }</script>
</head>
<body>
<div id="ui">
  <div class="row">
    <h1>HPP × CondMDI comparison</h1>
    <label>Clip / rough motion <select id="item"></select></label>
    <label>Realizer condition <select id="cond"></select></label>
    <a href="index.html">earlier viewer</a>
  </div>
  <div class="row"><span id="caption"></span><span id="stats"></span></div>
  <div class="row">
    <button id="play">Pause</button><button id="prev">◀</button><button id="next">▶</button>
    <label>Speed <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select></label>
    <span id="frame"></span><span id="kf"></span>
  </div>
  <div class="row"><div id="tlwrap"><canvas id="timeline"></canvas></div></div>
  <div class="row">
    <label><input type="checkbox" id="tKeys" checked> Key trajectories</label>
    <label><input type="checkbox" id="tTargets" checked> Constraint targets</label>
    <label><input type="checkbox" id="tGhost"> Original ghost on outputs</label>
    <label><input type="checkbox" id="tFollow" checked> Camera follows root</label>
    <label><input type="checkbox" id="tPauseKey"> Pause on observed frames</label>
    <button id="bMetrics">Metrics &amp; acceptance</button>
    <span class="legend" id="reasonLegend"></span>
  </div>
</div>
<div id="stage">
  <canvas id="c3d"></canvas>
  <div id="panels"></div>
  <div id="metrics" hidden></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from './OrbitControls.js';

const CHAINS = [[0,2,5,8,11],[0,1,4,7,10],[0,3,6,9,12,15],[9,14,17,19,21],[9,13,16,18,20]];
const CHAIN_SHADE = [0.85, 0.85, 1.0, 0.7, 0.7];
const KEY = 0xffd54f, ROOTADD = 0x80deea;
const NAMES = ['pelvis','L hip','R hip','spine1','L knee','R knee','spine2','L ankle','R ankle','spine3','L foot','R foot','neck','L collar','R collar','head','L shoulder','R shoulder','L elbow','R elbow','L wrist','R wrist'];
const REASONS = { start_end: ['#ffffff', 'start/end'], schedule: ['#b0bec5', '0.12 s schedule'], contact: ['#ff5252', 'contact/release'],
                  extremum: ['#ffd54f', 'extremum'], direction: ['#4fc3f7', 'direction change'], pause: ['#81c784', 'pause'],
                  error: ['#9e9e9e', 'error-driven'], key_pose: ['#b388ff', 'key pose (slerp)'] };
const LANES = [['root', 'Root'], ['left_hand', 'L hand'], ['right_hand', 'R hand'], ['left_ankle', 'L ankle'], ['right_ankle', 'R ankle'],
               ['left_foot', 'L foot'], ['right_foot', 'R foot'], ['torso_orientation', 'Torso']];
const COLORS = { original: 0xe8e8e8, rough: 0xb388ff, reps: [0x4fc3f7, 0xff8a65, 0x81c784] };
const PANELS = [
  { label: 'A · Original (HumanML3D)', color: COLORS.original, key: 'original' },
  { label: 'B · Rough motion', color: COLORS.rough, key: 'rough' },
  { label: 'Overlay: original · rough · sample 0', color: 0xffffff, key: 'overlay' },
  { label: 'C · CondMDI sample 0', color: COLORS.reps[0], key: 'rep0' },
  { label: 'C · CondMDI sample 1', color: COLORS.reps[1], key: 'rep1' },
  { label: 'C · CondMDI sample 2', color: COLORS.reps[2], key: 'rep2' },
];
PANELS.forEach((p, i) => p.layer = i + 1);
const L = Object.fromEntries(PANELS.map(p => [p.key, p.layer]));
const $ = id => document.getElementById(id);

const index = await (await fetch('data/index.json')).json();
const cache = {};
async function getItem(i) { const f = index.items[i].file; return cache[f] ??= await (await fetch('data/' + f)).json(); }

// ---------------- three.js ----------------
const canvas = $('c3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(devicePixelRatio); renderer.shadowMap.enabled = true; renderer.setScissorTest(true);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x14161b);
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 100); camera.position.set(0.6, 1.55, 3.1);
const controls = new OrbitControls(camera, canvas); controls.target.set(0, 0.85, 0); controls.enableDamping = true;
const hemi = new THREE.HemisphereLight(0xffffff, 0x333344, 1.2);
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(3, 8, 4); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); sun.shadow.mapSize.set(2048, 2048);
for (const l of [hemi, sun]) { l.layers.enableAll(); scene.add(l); }
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x1f2229 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(60, 120, 0x3a404c, 0x2a2e37); grid.position.y = 0.001; scene.add(grid);
const sphereGeo = new THREE.SphereGeometry(1, 16, 12);
const boneGeo = new THREE.CylinderGeometry(1, 1, 1, 10); boneGeo.translate(0, 0.5, 0);
const UP = new THREE.Vector3(0, 1, 0), va = new THREE.Vector3(), vb = new THREE.Vector3(), dir = new THREE.Vector3();
const world = new THREE.Group(); scene.add(world);
const setLayers = (o, ls) => o.traverse(x => { x.layers.disableAll(); ls.forEach(l => x.layers.enable(l)); });

class Skeleton {
  constructor(frames, color, layers, { opacity = 1, radius = 0.032 } = {}) {
    this.frames = frames; this.color = new THREE.Color(color); this.radius = radius; this.group = new THREE.Group();
    const tr = opacity < 1, mk = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.45, transparent: tr, opacity, depthWrite: !tr });
    this.joints = frames[0].map(() => { const m = new THREE.Mesh(sphereGeo, mk(this.color)); m.castShadow = !tr; m.scale.setScalar(radius); this.group.add(m); return m; });
    this.bones = [];
    CHAINS.forEach((ch, ci) => { const mat = mk(this.color.clone().multiplyScalar(CHAIN_SHADE[ci]));
      for (let i = 0; i < ch.length - 1; i++) { const b = new THREE.Mesh(boneGeo, mat); b.castShadow = !tr; this.group.add(b); this.bones.push([b, ch[i], ch[i + 1]]); } });
    setLayers(this.group, layers); world.add(this.group);
  }
  pose(f) {
    const fr = this.frames[Math.min(f, this.frames.length - 1)], r = this.radius * 0.6;
    fr.forEach((p, j) => this.joints[j].position.set(p[0], p[1], p[2]));
    for (const [m, a, b] of this.bones) { va.fromArray(fr[a]); vb.fromArray(fr[b]); dir.subVectors(vb, va);
      m.position.copy(va); m.scale.set(r, dir.length(), r); m.quaternion.setFromUnitVectors(UP, dir.normalize()); }
  }
  highlight(js) { const s = new Set(js);
    this.joints.forEach((m, j) => { const on = s.has(j); m.material.color.set(on ? KEY : this.color);
      m.material.emissive.set(on ? 0x553300 : 0); m.scale.setScalar(this.radius * (on ? 1.7 : 1)); }); }
}

let D = null, C = null, S = null, nFrames = 1, t = 0, playing = true, lastF = -1;
const targetMat = new THREE.MeshBasicMaterial({ color: KEY, wireframe: true });
const rootAddMat = new THREE.MeshBasicMaterial({ color: ROOTADD, wireframe: true });

function keyTrajectories() {
  const g = new THREE.Group();
  for (const o of D.observations) {
    if (o.variable !== 'position') continue;
    g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(D.original.map(f => new THREE.Vector3(...f[o.joint]))),
                         new THREE.LineBasicMaterial({ color: 0x6b7385, transparent: true, opacity: 0.7 })));
    const pos = [], col = [];
    for (const f of o.frames) { pos.push(...D.original[f][o.joint]); const c = new THREE.Color(REASONS[o.reasons[f]]?.[0] ?? '#fff'); col.push(c.r, c.g, c.b); }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.03, vertexColors: true })));
  }
  setLayers(g, [L.original, L.rough]); world.add(g); return g;
}

function build() {
  world.clear();
  const reps = C.reps;
  const targetFrames = C.target === 'rough' ? D.rough : D.original;
  S = { original: new Skeleton(D.original, COLORS.original, [L.original, L.overlay]),
        rough: new Skeleton(D.rough, COLORS.rough, [L.rough, L.overlay]),
        reps: reps.slice(0, 3).map((fr, i) => new Skeleton(fr, COLORS.reps[i], i === 0 ? [L.rep0, L.overlay] : [L[`rep${i}`]])),
        ghost: new Skeleton(D.original, COLORS.original, [L.rep0, L.rep1, L.rep2], { opacity: 0.18, radius: 0.026 }),
        keys: keyTrajectories(), targetFrames,
        targets: Array.from({ length: 22 }, (_, j) => { const s = new THREE.Mesh(sphereGeo, j === 0 ? rootAddMat : targetMat); s.scale.setScalar(0.055);
                                                        setLayers(s, [L.rep0, L.rep1, L.rep2]); world.add(s); return s; }) };
  nFrames = D.frames; lastF = -1;
  applyToggles(); renderMetrics(); drawTimeline();
}

async function loadItem() {
  D = await getItem(+$('item').value);
  $('cond').innerHTML = '';
  D.conditions.forEach((c, i) => $('cond').add(new Option(c.label, i)));
  const def = D.conditions.findIndex(c => c.experiment === 'B' && c.root_policy === 'dense');
  $('cond').value = Math.max(0, def);
  document.querySelector('#panels > div:nth-child(2) .lbl').textContent = 'B · Rough: ' + D.label;
  $('caption').textContent = `HumanML3D ${D.clip}: "${D.caption}" · ${D.frames} frames @ ${D.fps} fps (${(D.frames / D.fps).toFixed(2)} s) · no text given to CondMDI`;
  $('stats').textContent = `rough keeps ${D.hpp.observed} of ${D.hpp.total} joint-frames (${(100 * D.hpp.observed / D.hpp.total).toFixed(1)}%)`;
  t = 0; loadCond();
}
function loadCond() { C = D.conditions[+$('cond').value]; build(); }

// ---------------- UI ----------------
index.items.forEach((it, i) => $('item').add(new Option(`${it.clip} — ${it.label}`, i)));
$('item').onchange = loadItem; $('cond').onchange = loadCond;
$('reasonLegend').innerHTML = 'Key reason: ' + Object.values(REASONS).map(([c, n]) => `<span><i class="dot" style="background:${c}"></i>${n}</span>`).join('') +
  ` <span><i class="dot" style="background:#ffd54f"></i>constraint target</span><span><i class="dot" style="background:#80deea"></i>root target</span>`;
$('panels').innerHTML = PANELS.map(p => `<div><span class="lbl" style="color:#${new THREE.Color(p.color).getHexString()}">${p.label}</span><span class="sub" id="sub-${p.key}"></span></div>`).join('');
const setPlaying = p => { playing = p; $('play').textContent = p ? 'Pause' : 'Play'; };
$('play').onclick = () => setPlaying(!playing);
const step = d => { setPlaying(false); t = (Math.floor(t) + d + nFrames) % nFrames; };
$('prev').onclick = () => step(-1); $('next').onclick = () => step(1);
addEventListener('keydown', e => { if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); $('play').onclick(); } if (e.code === 'ArrowLeft') step(-1); if (e.code === 'ArrowRight') step(1); });
function applyToggles() { if (!S) return; S.keys.visible = $('tKeys').checked; S.ghost.group.visible = $('tGhost').checked; lastF = -1; }
for (const id of ['tKeys', 'tTargets', 'tGhost']) $(id).onchange = applyToggles;
$('bMetrics').onclick = () => { $('metrics').hidden = !$('metrics').hidden; $('bMetrics').classList.toggle('on', !$('metrics').hidden); };

const tl = $('timeline');
function drawTimeline() {
  const w = tl.clientWidth, h = tl.clientHeight, dpr = devicePixelRatio;
  tl.width = w * dpr; tl.height = h * dpr;
  const ctx = tl.getContext('2d'); ctx.scale(dpr, dpr);
  const lw = 58, lh = (h - 4) / LANES.length, X = f => lw + (f + 0.5) / nFrames * (w - lw - 4);
  ctx.font = '11px system-ui, sans-serif'; ctx.textBaseline = 'middle';
  LANES.forEach(([key, name], i) => {
    const y = 2 + i * lh;
    ctx.fillStyle = i % 2 ? '#1a1d24' : '#1e222a'; ctx.fillRect(lw, y, w - lw - 4, lh);
    ctx.fillStyle = '#8a90a0'; ctx.fillText(name, 2, y + lh / 2);
    const o = D.observations.find(x => x.name === key); if (!o) return;
    for (const f of o.frames) { ctx.fillStyle = REASONS[o.reasons[f]]?.[0] ?? '#fff'; ctx.fillRect(X(f) - 1, y + 2, 2, lh - 4); }
  });
  ctx.fillStyle = '#ffffffcc'; ctx.fillRect(X(Math.floor(t)) - 0.75, 0, 1.5, h);
}
let drag = false;
const seek = e => { const r = tl.getBoundingClientRect(); t = Math.min(nFrames - 1, Math.max(0, Math.floor((e.clientX - r.left - 58) / (r.width - 62) * nFrames))); };
tl.onpointerdown = e => { drag = true; setPlaying(false); seek(e); tl.setPointerCapture(e.pointerId); };
tl.onpointermove = e => drag && seek(e); tl.onpointerup = () => drag = false;

// ---------------- metrics / acceptance ----------------
function renderMetrics() {
  const cm = x => x == null ? '—' : (100 * x).toFixed(1), f2 = x => x == null ? '—' : x.toFixed(2), f0 = x => x == null ? '—' : x.toFixed(0);
  const hc = D.hpp.checks, tol = index.tolerances;
  const hppBadges = Object.entries(hc).map(([k, v]) => `<span class="badge ${v === true ? 'pass' : v === false ? 'fail' : ''}" title="${k}">${k.split('_')[0]}</span>`).join('');
  let html = `<b>${C.label}</b> — targets for constraint metrics: <b>${C.target === 'rough' ? 'rough motion' : 'original motion'}</b><br>` +
             `HPP stage checks: ${hppBadges}<div style="overflow-x:auto"><table><tr><th></th><th>constraint err mean / p95 (cm)</th><th>MPJPE vs original (cm)</th>` +
             `<th>root vs target (cm)</th><th>foot slide (m/s)</th><th>min foot y (cm)</th><th>contact recall</th><th>jerk (m/s³)</th>` +
             `<th>velocity err at constraints (m/s)</th><th>speed corr.</th><th>C1–C7</th></tr>`;
  const o = D.hpp.original_summary, r = D.hpp.rough_summary;
  html += `<tr><td>Original</td><td>—</td><td>0.0</td><td>—</td><td>${f2(o.foot_slide)}</td><td>${cm(o.min_foot)}</td><td>1.00</td><td>${f0(o.jerk)}</td><td>—</td><td>—</td><td></td></tr>`;
  html += `<tr><td>Rough motion</td><td>—</td><td>${cm(r.mpjpe)}</td><td>—</td><td>${f2(r.foot_slide)}</td><td>${cm(r.min_foot)}</td><td>${f2(r.contact_recall)}</td><td>${f0(r.jerk)}</td><td>—</td><td>—</td><td></td></tr>`;
  if (C.metrics) C.metrics.forEach((m, i) => {
    const badges = Object.entries(C.checks[i]).map(([k, v]) => `<span class="badge ${v === true ? 'pass' : v === false ? 'fail' : ''}" title="${k}">${k.split('_')[0]}</span>`).join('');
    html += `<tr><td>CondMDI sample ${i}</td><td>${cm(m.constraint_mean)} / ${cm(m.constraint_p95)}</td><td>${cm(m.mpjpe)}</td><td>${cm(m.root_vs_target)}</td>` +
            `<td>${f2(m.foot_slide)}</td><td>${cm(m.min_foot)}</td><td>${f2(m.contact_recall)}</td><td>${f0(m.jerk)}</td><td>${f2(m.vel_err)}</td><td>${f2(m.speed_corr)}</td><td>${badges}</td></tr>`;
  });
  html += `</table></div><div class="note">Tolerances (fixed before evaluation): constraint mean ≤ ${cm(tol.condmdi.C2_constraint_mean_err_m)} cm and p95 ≤ ${cm(tol.condmdi.C2_constraint_p95_err_m)} cm; ` +
          `root ≤ ${cm(tol.condmdi.C3_root_mean_err_m)} cm; foot slide ≤ ${tol.condmdi.C4_foot_slide_max_ratio}× original; min foot y ≥ ${cm(tol.condmdi.C5_min_foot_height_m)} cm; ` +
          `contact recall ≥ ${tol.condmdi.C6_contact_recall_min}; jerk ≤ ${tol.condmdi.C7_jerk_max_ratio}× the reference run (${f0(D.ref_jerk)} m/s³: CondMDI with the original's full body every 5 frames). ` +
          `Constraint error counts only HPP-selected joint-frames; the root added on other frames (cyan targets) is reported separately in the JSON reports.` +
          (C.record ? ` Seeds ${C.record.seeds.join(', ')} · ${C.record.observed_joint_frames} constrained joint-frames (${C.record.mask_counts.hpp_position_observations} HPP + ${C.record.mask_counts.root_added} root).` : '') + `</div>`;
  $('metrics').innerHTML = html;
  PANELS.forEach(p => { let s = '';
    if (p.key === 'rough') s = `MPJPE ${cm(r.mpjpe)} cm vs original`;
    if (p.key.startsWith('rep') && C.metrics) { const m = C.metrics[+p.key[3]]; s = `constraint err ${cm(m.constraint_mean)} cm · MPJPE ${cm(m.mpjpe)} cm`; }
    $(`sub-${p.key}`).textContent = s; });
}

function resize() { const r = $('stage').getBoundingClientRect(); renderer.setSize(r.width, r.height, false); if (D) drawTimeline(); }
addEventListener('resize', resize);
await loadItem(); resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (playing) t = (t + dt * D.fps * +$('speed').value) % nFrames;
  const f = Math.floor(t);
  if (f !== lastF) {
    const obs = D.obs_per_frame[f], cons = C.constrained_per_frame[f];
    if (playing && $('tPauseKey').checked && obs.length && lastF !== -1 && f !== 0) setPlaying(false);
    S.original.pose(f); S.original.highlight(obs); S.rough.pose(f); S.rough.highlight(obs);
    S.reps.forEach(s => s.pose(f)); S.ghost.pose(f);
    S.targets.forEach((m, j) => { const on = $('tTargets').checked && cons.includes(j); m.visible = on; if (on) m.position.fromArray(S.targetFrames[f][j]); });
    $('frame').textContent = `Frame ${f + 1} / ${nFrames}`;
    $('kf').textContent = obs.length ? `HPP observed: ${obs.map(j => NAMES[j]).join(', ')}` : '';
    lastF = f; drawTimeline();
  }
  if ($('tFollow').checked) { const r = D.original[f][0], d = new THREE.Vector3(r[0], 0.85, r[2]).sub(controls.target); controls.target.add(d); camera.position.add(d); }
  controls.update();
  const stage = canvas.getBoundingClientRect();
  [...$('panels').children].forEach((div, i) => {
    const r = div.getBoundingClientRect(), x = r.left - stage.left, y = stage.bottom - r.bottom;
    renderer.setViewport(x, y, r.width, r.height); renderer.setScissor(x, y, r.width, r.height);
    camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
    camera.layers.set(0); camera.layers.enable(PANELS[i].layer); renderer.render(scene, camera);
  });
});
</script>
</body>
</html>
